name: APAX Version Check and Container Build

on:
  push:
    branches:
      - main
  schedule:
    # Check daily at 6:00 UTC for new APAX versions
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build container even if no new version'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: containers.github.siemens.cloud
  IMAGE_NAME: simatic-ax/ci-images

jobs:
  check-apax-version:
    name: Check for new APAX version
    runs-on: ubuntu-22.04
    container:
      image: containers.github.siemens.cloud/simatic-ax/ci-images/apax-ci-image:4.1.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      new-version-available: ${{ steps.version-check.outputs.new-version-available }}
      current-version: ${{ steps.version-check.outputs.current-version }}
      latest-version: ${{ steps.version-check.outputs.latest-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to required registries
        uses: simatic-ax/actions/apax-login@v3
        with:
          apax-token: ${{ secrets.APAX_TOKEN }}

      - name: Check current APAX version
        id: current-version
        run: |
          CURRENT_VERSION=$(apax --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^[:space:]]*')
          echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current APAX version: $CURRENT_VERSION"

      - name: Check for updates
        id: version-check
        run: |
          set -e
          
          echo "Checking for APAX updates..."
          
          # Use timeout to prevent hanging
          timeout 60s apax self-update --check > apax_check.log 2>&1 || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 124 ]; then
              echo "⚠️ Timeout while checking for updates"
            else
              echo "⚠️ Error checking for updates (exit code: $EXIT_CODE)"
            fi
            cat apax_check.log
          }
          
          NEW_APAX_OUTPUT=$(cat apax_check.log)
          echo "APAX self-update --check output: '$NEW_APAX_OUTPUT'"
          
          if echo "$NEW_APAX_OUTPUT" | grep -q "Found new version:"; then
            echo "new-version-available=true" >> $GITHUB_OUTPUT
            
            LATEST_VERSION=$(echo "$NEW_APAX_OUTPUT" | sed -n 's/.*Found new version: *\([0-9][0-9.]*[0-9]\).*/\1/p')
            
            if [ -z "$LATEST_VERSION" ]; then
              LATEST_VERSION=$(echo "$NEW_APAX_OUTPUT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^[:space:]]*' | head -1)
            fi
            
            if [ -z "$LATEST_VERSION" ]; then
              LATEST_VERSION="latest"
            fi
            
            echo "latest-version=$LATEST_VERSION" >> $GITHUB_OUTPUT
            echo "✅ New APAX version available: $LATEST_VERSION"
            
          elif echo "$NEW_APAX_OUTPUT" | grep -q "is already up-to-date\|up to date"; then
            echo "new-version-available=false" >> $GITHUB_OUTPUT
            CURRENT_VERSION=$(apax --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^[:space:]]*')
            echo "latest-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "ℹ️ No new APAX version available - already up-to-date"
            
          else
            echo "new-version-available=false" >> $GITHUB_OUTPUT
            CURRENT_VERSION=$(apax --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^[:space:]]*')
            echo "latest-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "⚠️ Unexpected output - assuming no new version available"
            echo "Output was: '$NEW_APAX_OUTPUT'"
          fi

  check-existing-image:
    name: Check if image already exists
    needs: check-apax-version
    runs-on: ubuntu-22.04
    if: needs.check-apax-version.outputs.new-version-available == 'true'
    outputs:
      image-exists: ${{ steps.check-image.outputs.exists }}
    steps:
      - name: Log in to container registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Check if image exists
        id: check-image
        run: |
          VERSION_TAG="${{ needs.check-apax-version.outputs.latest-version }}"
          IMAGE_URL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION_TAG}"
          
          echo "🔍 Checking if image exists: ${IMAGE_URL}"
          
          # Try to pull the image manifest to check if it exists
          if docker manifest inspect "${IMAGE_URL}" >/dev/null 2>&1; then
            echo "✅ Image already exists: ${IMAGE_URL}"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Image does not exist: ${IMAGE_URL}"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    name: Build and push container
    needs: [check-apax-version, check-existing-image]
    runs-on: ubuntu-22.04
    if: |
      (needs.check-apax-version.outputs.new-version-available == 'true' && needs.check-existing-image.outputs.image-exists == 'false') || 
      github.event.inputs.force_build == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        run: |
          # Docker is already available in ubuntu-22.04
          docker --version
          
          # Enable experimental features for buildx
          mkdir -p ~/.docker
          echo '{"experimental": "enabled"}' > ~/.docker/config.json

      - name: Debug container registry access
        run: |
          echo "🔍 Debugging container registry access..."
          echo "Registry URL: containers.github.siemens.cloud"
          echo "Actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          
          # Test if registry is reachable
          echo "Testing registry connectivity..."
          curl -I https://containers.github.siemens.cloud/ || echo "Registry not reachable via HTTPS"
          
          # Test token format (without revealing it)
          TOKEN_LENGTH=$(echo "${{ secrets.GITHUB_TOKEN }}" | wc -c)
          echo "Token length: $TOKEN_LENGTH characters"
          
          # Test if token starts with expected format
          if echo "${{ secrets.GITHUB_TOKEN }}" | grep -q "^gh[ps]_"; then
            echo "✅ Token appears to have correct GitHub format"
          else
            echo "⚠️ Token does not appear to be a GitHub token"
          fi

      - name: Test registry authentication
        continue-on-error: true
        run: |
          echo "🔐 Testing authentication to source registry..."
          
          # Try to authenticate and capture detailed error
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login containers.github.siemens.cloud -u ${{ github.actor }} --password-stdin 2>&1 | tee login_output.log
          
          LOGIN_EXIT_CODE=${PIPESTATUS[1]}
          echo "Login exit code: $LOGIN_EXIT_CODE"
          
          if [ $LOGIN_EXIT_CODE -eq 0 ]; then
            echo "✅ Authentication successful"
          else
            echo "❌ Authentication failed"
            echo "Error details:"
            cat login_output.log
            
            # Check common error patterns
            if grep -q "unauthorized" login_output.log; then
              echo "🔍 Issue: Unauthorized - likely token permission issue"
            elif grep -q "not found\|404" login_output.log; then
              echo "🔍 Issue: Registry URL might be incorrect"
            elif grep -q "timeout\|connection" login_output.log; then
              echo "🔍 Issue: Network connectivity problem"
            fi
          fi

      - name: Log in to source container registry
        run: |
          echo "🔐 Attempting final login to source registry..."
          
          # Use the working authentication method from tests above
          if echo "${{ secrets.GITHUB_TOKEN }}" | docker login containers.github.siemens.cloud -u ${{ github.actor }} --password-stdin; then
            echo "✅ Successfully logged in to source registry"
          else
            echo "❌ Failed to login to source registry"
            echo "Please check:"
            echo "1. Registry URL: containers.github.siemens.cloud"
            echo "2. Username: ${{ github.actor }}"
            echo "3. Token permissions for packages:read"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          echo "🔨 Building Docker image using existing Dockerfile..."
          
          # Get version for tagging
          VERSION_TAG="${{ needs.check-apax-version.outputs.latest-version }}"
          echo "Building image with version tag: ${VERSION_TAG}"
          
          # Validate that we have a version
          if [ -z "${VERSION_TAG}" ]; then
            echo "❌ Error: Version tag is empty"
            exit 1
          fi
          
          # Build the image using the existing Dockerfile in its original location
          docker build \
            --build-arg APAX_TOKEN="${{ secrets.APAX_TOKEN }}" \
            --build-arg APAX_VERSION="${VERSION_TAG}" \
            --label "apax.version=${VERSION_TAG}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=APAX CI Container with version ${VERSION_TAG}" \
            --label "org.opencontainers.image.version=${VERSION_TAG}" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label "build.workflow=${{ github.workflow }}" \
            --label "build.run-id=${{ github.run_id }}" \
            --progress=plain \
            --no-cache \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:apax-ci-image-${VERSION_TAG}" \
            dockerfiles/apax-ci-image/ || {
              echo "❌ Build failed, this might be expected if APAX update requires authentication"
              echo "The build process tried to update APAX but authentication might be missing"
              exit 1
            }

      - name: Test new image
        run: |
          echo "🧪 Testing the newly built image..."
          
          # Generate version tag for testing
          VERSION_TAG="${{ needs.check-apax-version.outputs.latest-version }}"
          
          # Test if APAX is working in the new image
          docker run --rm "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:apax-ci-image-${VERSION_TAG}" apax --version || {
            echo "⚠️ APAX test failed, but continuing with deployment"
          }

      - name: Tag image with additional tags
        run: |
          VERSION_TAG="${{ needs.check-apax-version.outputs.latest-version }}"
          DATE_TAG="$(date +'%Y%m%d')"
          
          # Tag with latest
          docker tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION_TAG}" \
                     "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          
          # Tag with date
          docker tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION_TAG}" \
                     "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${DATE_TAG}"

      - name: Push Docker images
        run: |
          # Push version tag
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:apax-ci-image-${{ needs.check-apax-version.outputs.latest-version }}"
          
          # Push latest tag
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:apax-ci-image-latest"
          
          # Push date tag
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:apax-ci-image-$(date +'%Y%m%d')"

      - name: Verify pushed image
        run: |
          echo "✅ Container build and push completed successfully"
          echo "Available tags in Siemens Registry:"
          echo "- ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.check-apax-version.outputs.latest-version }}"
          echo "- ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "- ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$(date +'%Y%m%d')"

  notify:
    name: Notification
    needs: [check-apax-version, check-existing-image, build-and-push]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify on success
        if: |
          needs.check-apax-version.outputs.new-version-available == 'true' && 
          needs.build-and-push.result == 'success'
        run: |
          echo "✅ New APAX container successfully built!"
          echo "New version: ${{ needs.check-apax-version.outputs.latest-version }}"
          echo "Container: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.check-apax-version.outputs.latest-version }}"

      - name: Notify on failure
        if: |
          needs.check-apax-version.outputs.new-version-available == 'true' && 
          needs.build-and-push.result == 'failure'
        run: |
          echo "❌ Error building APAX container!"
          echo "Version: ${{ needs.check-apax-version.outputs.latest-version }}"
          exit 1

      - name: No update available
        if: needs.check-apax-version.outputs.new-version-available == 'false'
        run: |
          echo "ℹ️ No new APAX version available"
          echo "Current version: ${{ needs.check-apax-version.outputs.current-version }}"

      - name: Image already exists
        if: |
          needs.check-apax-version.outputs.new-version-available == 'true' && 
          needs.check-existing-image.outputs.image-exists == 'true'
        run: |
          echo "ℹ️ Container image already exists for APAX version ${{ needs.check-apax-version.outputs.latest-version }}"
          echo "Skipping build as image is already available"