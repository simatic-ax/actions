name: APAX Version Check and Container Build

on:
  push:
    branches:
      - main
  schedule:
    # Prüfe täglich um 6:00 UTC auf neue APAX Versionen
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Manueller Trigger für Tests
    inputs:
      force_build:
        description: 'Force build container even if no new version'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/apax-container

jobs:
  check-apax-version:
    name: Check for new APAX version
    runs-on: ubuntu-22.04
    container:
      image: containers.github.siemens.cloud/simatic-ax/ci-images/apax-ci-image:4.1.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      new-version-available: ${{ steps.version-check.outputs.new-version-available }}
      current-version: ${{ steps.version-check.outputs.current-version }}
      latest-version: ${{ steps.version-check.outputs.latest-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to required registries
        uses: simatic-ax/actions/apax-login@v3
        with:
          apax-token: ${{ secrets.APAX_TOKEN }}

      - name: Check current APAX version
        id: current-version
        run: |
          CURRENT_VERSION=$(apax --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^[:space:]]*')
          echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current APAX version: $CURRENT_VERSION"

      - name: Check for updates
        id: version-check
        run: |
          # Verwende apax self-update --check um nach Updates zu suchen
          # Ein Error Code bedeutet, dass eine neue Version verfügbar ist
          set +e  # Deaktiviere exit on error temporär
          UPDATE_OUTPUT=$(apax self-update --check 2>&1)
          EXIT_CODE=$?
          set -e  # Reaktiviere exit on error
          
          echo "APAX self-update --check output:"
          echo "$UPDATE_OUTPUT"
          echo "Exit code: $EXIT_CODE"
          
          if [ $EXIT_CODE -ne 0 ]; then
            # Error Code bedeutet neue Version verfügbar
            echo "new-version-available=true" >> $GITHUB_OUTPUT
            
            # Parse das spezifische Format "Found new version: X.Y.Z"
            LATEST_VERSION=$(echo "$UPDATE_OUTPUT" | grep "Found new version:" | sed 's/.*Found new version: *\([0-9][0-9.]*[0-9]\).*/\1/')
            
            # Fallback: Versuche allgemeines Versionsmuster falls das spezifische Format nicht gefunden wird
            if [ -z "$LATEST_VERSION" ]; then
              LATEST_VERSION=$(echo "$UPDATE_OUTPUT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^[:space:]]*' | tail -1)
            fi
            
            # Als letzter Fallback verwende "latest"
            if [ -z "$LATEST_VERSION" ]; then
              LATEST_VERSION="latest"
            fi
            
            echo "latest-version=$LATEST_VERSION" >> $GITHUB_OUTPUT
            echo "✅ New APAX version available: $LATEST_VERSION"
          else
            # Exit Code 0 bedeutet keine neue Version
            echo "new-version-available=false" >> $GITHUB_OUTPUT
            CURRENT_VERSION=$(apax --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^[:space:]]*')
            echo "latest-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "ℹ️ No new APAX version available"
          fi

      - name: Check last built version
        id: last-built
        run: |
          # Prüfe die letzte gebaute Version aus dem Container Registry
          LAST_BUILT_VERSION=""
          
          # Versuche die Tags vom Container Registry zu holen
          if docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest > /dev/null 2>&1; then
            # Hole die Labels vom Container um die Version zu ermitteln
            LAST_BUILT_VERSION=$(docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --format='{{index .Config.Labels "apax.version"}}' 2>/dev/null || echo "")
          fi
          
          echo "last-built-version=$LAST_BUILT_VERSION" >> $GITHUB_OUTPUT
          echo "Last built version: $LAST_BUILT_VERSION"

  build-and-push:
    name: Build and push container
    needs: check-apax-version
    runs-on: ubuntu-22.04
    if: |
      needs.check-apax-version.outputs.new-version-available == 'true' || 
      github.event.inputs.force_build == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        run: |
          # Docker ist bereits in ubuntu-latest verfügbar
          docker --version
          # Setup buildx wenn nicht vorhanden
          docker buildx version || docker buildx install

      - name: Log in to Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          # Verwende das bestehende APAX CI-Image als Basis
          FROM containers.github.siemens.cloud/simatic-ax/ci-images/apax-ci-image:4.1.1 as builder
          
          # Update APAX zur neuesten Version
          RUN apax self-update --force-latest
          
          # Verifiziere Installation
          RUN apax --version
          
          # Runtime Stage - verwende das gleiche Basis-Image für Konsistenz
          FROM containers.github.siemens.cloud/simatic-ax/ci-images/apax-ci-image:4.1.1
          
          # Kopiere die aktualisierte APAX Installation vom Builder
          COPY --from=builder /root/.apax /root/.apax
          
          # Labels für Metadaten
          LABEL apax.version="${{ needs.check-apax-version.outputs.latest-version }}"
          LABEL org.opencontainers.image.source="${{ github.repository }}"
          LABEL org.opencontainers.image.description="Container mit der neuesten APAX Version"
          LABEL org.opencontainers.image.version="${{ needs.check-apax-version.outputs.latest-version }}"
          
          # Setze Arbeitsverzeichnis
          WORKDIR /workspace
          
          # Standardcommand
          CMD ["apax", "--help"]
          EOF

      - name: Generate metadata
        id: meta
        run: |
          # Generiere Tags
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.check-apax-version.outputs.latest-version }}"
          TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$(date +%Y%m%d)"
          
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          
          # Generiere Labels
          LABELS="apax.version=${{ needs.check-apax-version.outputs.latest-version }}"
          LABELS="$LABELS,org.opencontainers.image.source=${{ github.repository }}"
          LABELS="$LABELS,org.opencontainers.image.description=Container mit der neuesten APAX Version"
          LABELS="$LABELS,org.opencontainers.image.version=${{ needs.check-apax-version.outputs.latest-version }}"
          LABELS="$LABELS,org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          
          echo "labels=$LABELS" >> $GITHUB_OUTPUT
          
          echo "Generated tags: $TAGS"
          echo "Generated labels: $LABELS"

      - name: Build and push container
        run: |
          # Build Container mit Labels
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.meta.outputs.tags }}"
          IFS=',' read -ra LABEL_ARRAY <<< "${{ steps.meta.outputs.labels }}"
          
          # Erstelle Label-Argumente für Docker Build
          LABEL_ARGS=""
          for label in "${LABEL_ARRAY[@]}"; do
            LABEL_ARGS="$LABEL_ARGS --label $label"
          done
          
          # Build des Containers mit dem ersten Tag
          PRIMARY_TAG="${TAG_ARRAY[0]}"
          echo "Building container with primary tag: $PRIMARY_TAG"
          
          docker build $LABEL_ARGS -t "$PRIMARY_TAG" .
          
          # Tag mit allen anderen Tags
          for tag in "${TAG_ARRAY[@]:1}"; do
            echo "Tagging with: $tag"
            docker tag "$PRIMARY_TAG" "$tag"
          done
          
          # Push aller Tags
          for tag in "${TAG_ARRAY[@]}"; do
            echo "Pushing: $tag"
            docker push "$tag"
          done
          
          echo "✅ Container build and push completed successfully"

  notify:
    name: Notification
    needs: [check-apax-version, build-and-push]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify on success
        if: |
          needs.check-apax-version.outputs.new-version-available == 'true' && 
          needs.build-and-push.result == 'success'
        run: |
          echo "✅ Neuer APAX Container erfolgreich gebaut!"
          echo "Neue Version: ${{ needs.check-apax-version.outputs.latest-version }}"
          echo "Container: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.check-apax-version.outputs.latest-version }}"

      - name: Notify on failure
        if: |
          needs.check-apax-version.outputs.new-version-available == 'true' && 
          needs.build-and-push.result == 'failure'
        run: |
          echo "❌ Fehler beim Bauen des APAX Containers!"
          echo "Version: ${{ needs.check-apax-version.outputs.latest-version }}"
          exit 1

      - name: No update available
        if: needs.check-apax-version.outputs.new-version-available == 'false'
        run: |
          echo "ℹ️ Keine neue APAX Version verfügbar"
          echo "Aktuelle Version: ${{ needs.check-apax-version.outputs.current-version }}"