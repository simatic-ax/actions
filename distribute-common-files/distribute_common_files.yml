name: Distribute common files

on:
  workflow_dispatch: {} #to enable manual triggering of the action
  inputs:
    file_name:
      description: |
        like "files/libraries/workflows/release-library.yml" more spilted with "," (maybe - eigentlich erstmal nur eine file)
      required: true
      type: string
    target_path:
      description: |
        like ".github/workflows"
      required: true
      type: string

jobs:
  deploy_common_file:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
        - name: Replicating global workflow
          uses: derberg/manage-files-in-multiple-repositories@v2
          with:
            github_token: ${{ secrets.DEPLOY_KEY }}
            patterns_to_include: ${{ github.event.inputs.file_name }}
            destination:  ${{ github.event.inputs.target_path }}
            topics_to_include: library
            exclude_private: false
            exclude_forked: true
            committer_username: simatic-ax-bot
            commit_message: "ci: distribute workflows for libraries"
  
