name: "Test source code"
description: "Tests the source code based on the projects apax.yaml file"
inputs:
  ignore-scripts:
    description: "Do not run pretest and posttest scripts"
    required: false
    default: "false"
  ingore-scripts:
    description: "DEPRECATED (typo). Use 'ignore-scripts' instead. Kept for backward compatibility and will be removed in a future major version."
    required: false
    default: "false"
  playlist:
    description: "Specifies the play list filepath"
    required: false
    default: ""
  coverage:
    description: "Specifies to get coverage"
    required: false
    default: "false"
  log-level:
    description: "Log level for the 'apax test' command. Allowed values: info, debug. Note: 'apax test' is a contributed command (from @ax/axunit) and does not support the 'trace' level that apax core commands accept. Mapped to '--loglevel'."
    required: false
    default: ""
  loglevel:
    description: "DEPRECATED. Use 'log-level' instead. Kept for backward compatibility and will be removed in a future major version."
    required: false
    default: ""
  path:
    description: "The relative path to the project which is to be built"
    required: false
    default: "."
  # currently not supported
  # filter:
  #   description: "Specifies the filter for the test cases"
  #   required: false
  #   default: "Runs specific tests with a filter"
  # engine:
  #   description: "Engine for running test(s) -> llvm, mc7p or plcsim"
  #   required: false
  #   default: "llvm"
  # target-ip:
  #   description: "Target IP address for the PLC. Required when target is `mc7p` or `plcsim`"
  #   required: false
  #   default: ""
  # username:
  #   description: " The legitimation user name to get access to the PLC. Required when target is `mc7p` or `plcsim` and a UMAC-PLC"
  #   required: false
  #   default: ""
  # password: 
  #   description: "The certificate file to get access to the PLC. Required when target is `mc7p` or `plcsim` and a PLC which requires a certificate"
  #   required: false
  #   default: ""
  # certificate:
  #   description: "The certificate file to get access to the PLC. Required when target is `mc7p` or `plcsim` and a PLC which requires a certificate"
  #   required: false
  #   default: ""
runs:
  using: "composite"
  steps:
    - name: Test source code
      shell: bash
      run: |
        # Change to the project directory
        cd ${{ inputs.path }}

        # base command
        CMD="apax test"

        # process inputs

        # --ignore-scripts Flag (accepts both the correct name and the deprecated typo alias)
        # Note: both inputs default to "false", so we only treat "true" as an explicit user intent.
        IGNORE_SCRIPTS="${{ inputs.ignore-scripts }}"
        LEGACY_IGNORE_SCRIPTS="${{ inputs.ingore-scripts }}"
        if [ "$IGNORE_SCRIPTS" == "true" ] && [ "$LEGACY_IGNORE_SCRIPTS" == "true" ]; then
          echo "Error: The inputs 'ignore-scripts' and 'ingore-scripts' are mutually exclusive. 'ingore-scripts' is deprecated (typo); please use only 'ignore-scripts'."
          exit 1
        fi
        if [ "$LEGACY_IGNORE_SCRIPTS" == "true" ]; then
          echo "Warning: The input 'ingore-scripts' is deprecated (typo). Use 'ignore-scripts' instead."
          IGNORE_SCRIPTS="true"
        fi
        if [ "$IGNORE_SCRIPTS" == "true" ]; then
          echo "Info: Add --ignore-scripts to cmd"
          CMD="$CMD --ignore-scripts"
        fi

        # --playlist path
        if [ -n "${{ inputs.playlist }}" ]; then
          if [ -f "${{ inputs.playlist }}" ]; then
            CMD="$CMD --playlist '${{ inputs.playlist }}'"
            echo "Info: Add --playlist with parameters ${{ inputs.playlist }} to cmd"
          else
            echo "Error: The specified playlist path '${{ inputs.playlist }}' does not exist."
            exit 1
          fi
        fi

        # --coverage Flag
        if [ "${{ inputs.coverage }}" == "true" ]; then
          echo "Info: Add --coverage to cmd"
          CMD="$CMD --coverage"
        fi

        # --loglevel <level>
        # Note: 'apax test' is a contributed command from @ax/axunit. It exposes its own
        # '-l/--loglevel' option (values: info, debug) and does NOT support the apax core
        # '--log' option nor the 'trace' level.
        # log-level is the current input; loglevel is kept as a deprecated alias.
        LOG_LEVEL="${{ inputs.log-level }}"
        LEGACY_LOG_LEVEL="${{ inputs.loglevel }}"
        if [ -n "$LOG_LEVEL" ] && [ -n "$LEGACY_LOG_LEVEL" ]; then
          echo "Error: The inputs 'log-level' and 'loglevel' are mutually exclusive. 'loglevel' is deprecated; please use only 'log-level'."
          exit 1
        fi
        if [ -z "$LOG_LEVEL" ] && [ -n "$LEGACY_LOG_LEVEL" ]; then
          echo "Warning: The input 'loglevel' is deprecated. Use 'log-level' instead."
          LOG_LEVEL="$LEGACY_LOG_LEVEL"
        fi
        # normalize to lowercase for backward compatibility with previous default value 'Info'
        LOG_LEVEL="$(echo "$LOG_LEVEL" | tr '[:upper:]' '[:lower:]')"
        if [ -n "$LOG_LEVEL" ]; then
          if [ "$LOG_LEVEL" == "trace" ]; then
            echo "Error: log-level 'trace' is not supported by 'apax test' (contributed command). Allowed values: info, debug."
            exit 1
          fi
          if [ "$LOG_LEVEL" != "debug" ] && [ "$LOG_LEVEL" != "info" ]; then
            echo "Error: log-level must be one of: info, debug"
            exit 1
          fi
          echo "Info: Add --loglevel $LOG_LEVEL to cmd"
          CMD="$CMD --loglevel $LOG_LEVEL"
        fi

        echo "Running command: $CMD"
        eval $CMD