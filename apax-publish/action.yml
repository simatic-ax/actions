name: "Publish apax package"
description: "Publishes an apax package to one or multiple remote registries"
inputs:
  registries:
    description: "A newline-delimited string of registries the package is to be published to"
    required: true
  tag:
    description: "The tag to apply to the published package. Must be lowercase, must not start with a digit or 'v', and must not be a valid semantic version. Default is latest"
    required: false
    default: "latest"
  log-level:
    description: "Log level for the apax command. Allowed values: trace, debug, info"
    required: false
    default: ""
  path:
    description: "The relative path to the folder where the apax package is located"
    required: false
    default: "."
runs:
  using: "composite"
  steps:
    - name: Pack source code
      shell: bash
      run: |
        # Change to the project directory
        cd ${{ inputs.path }}

        # base command
        CMD="apax publish"

        # search for the .apax.tgz file
        PACKAGE_FILES=$(find . -maxdepth 1 -name "*.apax.tgz")

        # Count the found files
        PACKAGE_COUNT=$(echo "$PACKAGE_FILES" | wc -l)

        if [ "$PACKAGE_COUNT" -eq 0 ]; then
          echo "Error: No .apax.tgz package found in the specified path."
          exit 1
        elif [ "$PACKAGE_COUNT" -gt 1 ]; then
          echo "Error: Multiple .apax.tgz packages found in the specified path. Please ensure there is only one package."
          exit 1
        fi

        PACKAGE_FILE=$(echo "$PACKAGE_FILES" | head -n 1)

        # add package file to command
        CMD="$CMD --package $PACKAGE_FILE"

        # resolve tag (default: latest) and validate against apax 4.3 tag rules:
        # - lowercase only
        # - must not start with a digit or the letter 'v'
        # - must not be a valid semantic version
        TAG_VALUE="${{ inputs.tag }}"
        if [ -z "$TAG_VALUE" ]; then
          TAG_VALUE="latest"
        fi
        if [[ "$TAG_VALUE" =~ [A-Z] ]]; then
          echo "Error: tag '$TAG_VALUE' must be lowercase."
          exit 1
        fi
        if [[ "$TAG_VALUE" =~ ^[0-9v] ]]; then
          echo "Error: tag '$TAG_VALUE' must not start with a digit or the letter 'v'."
          exit 1
        fi
        if [[ "$TAG_VALUE" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9a-zA-Z.-]+)?(\+[0-9a-zA-Z.-]+)?$ ]]; then
          echo "Error: tag '$TAG_VALUE' must not be a valid semantic version."
          exit 1
        fi
        echo "Info: Use for --tag the value $TAG_VALUE"
        CMD="$CMD --tag '$TAG_VALUE'"

        # --log <level>
        LOG_LEVEL="${{ inputs.log-level }}"
        if [ -n "$LOG_LEVEL" ]; then
          if [ "$LOG_LEVEL" != "trace" ] && [ "$LOG_LEVEL" != "debug" ] && [ "$LOG_LEVEL" != "info" ]; then
            echo "Error: log-level must be one of: trace, debug, info"
            exit 1
          fi
          echo "Info: Add --log $LOG_LEVEL to cmd"
          CMD="$CMD --log $LOG_LEVEL"
        fi

        # URL Regular Expression
        trimmed_registries=$(echo "${{ inputs.registries }}" | sed '/^$/d' | tr -s '\n')
        url_regex="https?:\/\/(www\.)?[a-zA-Z0-9-]+(\.[a-zA-Z]{2,})+(/[a-zA-Z0-9#?=&%+._-]*)?"
        
        # Process registries input
        while IFS= read -r url; do
          if [[ -n "$url" ]]; then
            if [[ "$url" =~ $url_regex ]]; then
              echo "Found valid URL: $url"
              echo "Running command: $CMD --registry $url"
              eval "$CMD --registry $url"
            else
              echo "Invalid URL: $url"
              exit 1
            fi
          else
            echo "Error: Empty registry entry"
            exit 1
          fi
        done <<< "$trimmed_registries"
 